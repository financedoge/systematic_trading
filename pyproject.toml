[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-trading"
version = "0.1.0"
description = "Global long-horizon portfolio research, backtesting, and execution toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic-settings>=2.10.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
data = [
    "tushare>=1.2.10",
]
ib = [
    # Install the matching official SDK with scripts/install_ib_api.py.
    "protobuf==5.29.5",
]
queue = [
    "nats-py>=2.8.0,<3",
]
test = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
    "ruff>=0.16,<0.17",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixture imports are intentionally referenced by parameter name.
"tests/*" = ["F401", "F811"]
