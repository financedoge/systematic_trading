services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest}
    container_name: systematic-trading-clickhouse
    environment:
      CLICKHOUSE_DB: ${ST_CLICKHOUSE_DATABASE:-systematic_trading}
      CLICKHOUSE_USER: ${ST_CLICKHOUSE_USER:-st_app}
      CLICKHOUSE_PASSWORD: ${ST_CLICKHOUSE_PASSWORD:-local-dev-change-me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - "${ST_CLICKHOUSE_LOG_ROOT:-D:/systematic_trading_data/clickhouse/logs}:/var/log/clickhouse-server"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  clickhouse_data:
