<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strategy Detail</title>
<style>:root{--bg:#f6f7f9;--panel:#fff;--text:#1d2433;--muted:#667085;--line:#d9dee7;--focus:#2456a6;--good:#087f5b;--benchmark:#111827}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}header{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}h1,h2{margin:0;letter-spacing:0}h1{font-size:18px}h2{font-size:15px}.actions{display:flex;gap:8px;align-items:center}.button{min-height:32px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}main{padding:16px 18px 28px}.titlebar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.note{color:var(--muted);font-size:12px}.badge{display:inline-block;margin-left:6px;padding:2px 7px;border:1px solid #9cd6cd;border-radius:999px;background:#ecf9f6;color:var(--good);font-size:10px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:7px}.metric{padding:11px}.metric label{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:4px;font-size:16px}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:12px;margin-bottom:12px}.panel{overflow:hidden}.head{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.body{padding:12px}.chart{min-height:300px}.chart svg{display:block;width:100%;height:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px 9px;border-bottom:1px solid #edf0f4;text-align:left}td.num,th.num{text-align:right}.line{fill:none;stroke:#2456a6;stroke-width:2}.bench{fill:none;stroke:var(--benchmark);stroke-width:1.5}.axis{stroke:#ccd3dd;stroke-width:1}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px}.swatch{width:18px;height:3px;background:#2456a6;display:inline-block}.swatch.bench{background:#111827}.exposures{display:grid;grid-template-columns:1fr 1fr;gap:12px}.warning{white-space:pre-wrap;color:#9a5b09}@media(max-width:900px){header{height:auto;align-items:flex-start;flex-direction:column;padding:10px 12px}.actions{width:100%;flex-wrap:wrap}.actions .button{flex:1 1 110px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.exposures{grid-template-columns:1fr}}@media(max-width:520px){.metrics{grid-template-columns:1fr}}</style></head>
<body><header><h1>Strategy Detail</h1><div class="actions"><a class="button" href="/operator">Trading</a><a class="button" href="/strategies">Strategies</a><a class="button" href="/platform">System</a><a class="button" href="/platform/market-data-audit">Market Data</a></div></header><main><div class="titlebar"><div><h1 id="name">Loading strategy</h1><div id="method" class="note"></div></div><div class="actions"><a class="button" href="/strategies">Back to registry</a><a id="report-link" class="button" hidden target="_blank">Full backtest report</a></div></div><section id="metrics" class="metrics"></section><div class="grid"><section class="panel"><div class="head"><h2>Performance vs Benchmark</h2><div class="legend"><span><i class="swatch"></i> Strategy</span><span><i class="swatch bench"></i> Benchmark</span></div></div><div id="chart" class="body chart"></div></section><section class="panel"><div class="head"><h2>Current Holdings</h2></div><div id="holdings" class="body"></div></section></div><section class="panel" style="margin-bottom:12px"><div class="head"><h2>Benchmark Comparison</h2></div><div id="comparison" class="body"></div></section><section class="panel"><div class="head"><h2>Exposure and Performance Attribution</h2></div><div class="body exposures"><div><h2>Country Exposure</h2><div id="country"></div></div><div><h2>Currency Exposure</h2><div id="currency"></div></div></div></section><div id="warnings" class="warning"></div></main>
<script>const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const pct=v=>v==null?"n/a":`${(Number(v)*100).toFixed(2)}%`;const ratio=v=>v==null?"n/a":Number(v).toFixed(2);const money=v=>v==null?"n/a":Number(v).toLocaleString(undefined,{maximumFractionDigits:0});function metric(label,value){return `<div class="metric"><label>${label}</label><strong>${value}</strong></div>`}function table(rows,headers){return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`}function exposureTable(values){const rows=Object.entries(values||{}).sort((a,b)=>Number(b[1])-Number(a[1])).map(([key,value])=>`<tr><td>${esc(key)}</td><td class="num">${money(value)}</td></tr>`);return table(rows,["Exposure","CNH"])}function chartSvg(strategy,benchmark){let s=strategy.map(x=>({d:x.trade_date,v:Number(x.nav_cnh)})).filter(x=>x.v>0),b=benchmark.map(x=>({d:x.trade_date,v:Number(x.nav_cnh)})).filter(x=>x.v>0);if(!s.length)return '<div class="note">No NAV series</div>';const baseS=s[0].v,baseB=b[0]?.v||1;const view=ChartNavigation.view('chart',[...s,...b],q=>Date.parse(q.d),()=>{document.getElementById('chart').innerHTML=chartSvg(strategy,benchmark)},{left:50,right:805,top:15,bottom:272});s=s.filter(q=>Date.parse(q.d)>=view.range[0]&&Date.parse(q.d)<=view.range[1]);b=b.filter(q=>Date.parse(q.d)>=view.range[0]&&Date.parse(q.d)<=view.range[1]);if(!s.length&&!b.length)return '<div class="note">No observations in this period. Use Full history to reset.</div>';const all=[...s.map(x=>({...x,i:x.v/baseS*100})),...b.map(x=>({...x,i:x.v/baseB*100}))],vals=all.map(x=>x.i),w=820,h=300,p={l:50,r:15,t:15,b:28},minX=view.range[0],maxX=view.range[1],minY=Math.min(...vals)*.98,maxY=Math.max(...vals)*1.02,x=d=>p.l+(Date.parse(d)-minX)/(maxX-minX||1)*(w-p.l-p.r),y=v=>h-p.b-(v-minY)/(maxY-minY||1)*(h-p.t-p.b),path=(rows,base)=>rows.map((q,i)=>`${i?'L':'M'} ${x(q.d).toFixed(1)} ${y(q.v/base*100).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}"><line class="axis" x1="${p.l}" x2="${w-p.r}" y1="${h-p.b}" y2="${h-p.b}"/><path class="line" d="${path(s,baseS)}"/>${b.length?`<path class="bench" d="${path(b,baseB)}"/>`:''}<text x="${p.l}" y="${h-8}" fill="#667085" font-size="11">${esc(new Date(minX).toISOString().slice(0,10))}</text><text x="${w-90}" y="${h-8}" fill="#667085" font-size="11">${esc(new Date(maxX).toISOString().slice(0,10))}</text></svg>`}function comparisonTable(c){if(!c?.metrics)return '<div class="note">No structured benchmark comparison artifact is available for this run.</div>';const labels={full:'Full',in_sample:'In sample',out_of_sample:'Out of sample'},rows=Object.entries(c.metrics).map(([key,v])=>`<tr><td>${labels[key]||esc(key)}</td><td class="num">${pct(v.candidate?.return)}</td><td class="num">${pct(v.baseline?.return)}</td><td class="num">${pct(v.delta?.return)}</td><td class="num">${ratio(v.candidate?.sharpe)}</td><td class="num">${ratio(v.active?.informationRatio)}</td><td class="num">${pct(v.candidate?.maxDrawdown)}</td></tr>`);return table(rows,["Window","Strategy","Benchmark","Alpha","Sharpe","Info Ratio","Max DD"])}const id=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());fetch(`/api/v1/strategies/${encodeURIComponent(id)}`).then(r=>{if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}).then(d=>{if(d.app_tracking&&d.report_url){location.replace(d.report_url);return}document.title=d.name;document.getElementById('name').innerHTML=`${esc(d.name)}${d.is_sota?'<span class="badge">CURRENT SOTA</span>':''}<span class="badge">${esc(d.lifecycle)}</span>`;document.getElementById('method').textContent=d.lifecycle==='monitored'?`Data through ${d.end_date}; artifact ended ${d.artifact_end_date}. ${d.monitoring_notes}`:`Archived artifact through ${d.artifact_end_date}.`;document.getElementById('metrics').innerHTML=metric('Total Return',pct(d.total_return))+metric('Annual Return',pct(d.annualized_return))+metric('Annual Volatility',pct(d.annualized_volatility))+metric('Sharpe',ratio(d.sharpe))+metric('Max Drawdown',pct(d.max_drawdown))+metric('Calmar',ratio(d.calmar))+metric('Leverage',ratio(d.leverage))+metric('Final NAV CNH',money(d.final_nav_cnh));document.getElementById('chart').innerHTML=chartSvg(d.nav_series||[],d.benchmark_series||[]);document.getElementById('holdings').innerHTML=table((d.holdings||[]).map(x=>`<tr><td>${esc(x.symbol)}</td>${AssetNames.cell(x.symbol)}<td class="num">${pct(x.weight)}</td><td class="num">${money(x.value_cnh)}</td></tr>`),['Ticker','Asset name','Weight','CNH']);document.getElementById('comparison').innerHTML=comparisonTable(d.comparison);document.getElementById('country').innerHTML=exposureTable(d.country_exposure_cnh);document.getElementById('currency').innerHTML=exposureTable(d.currency_exposure_cnh);document.getElementById('warnings').textContent=(d.warnings||[]).join('
');if(d.report_url){const a=document.getElementById('report-link');a.href=d.report_url;a.hidden=false}}).catch(e=>{document.getElementById('name').textContent='Strategy unavailable';document.getElementById('warnings').textContent=e.message});</script></body></html>
